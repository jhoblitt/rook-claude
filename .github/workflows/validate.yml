name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin
        run: |
          claude plugin validate .
          claude plugin validate plugins/rook-maintainer

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: plugins/rook-maintainer/tools/go.mod
          cache: false

      - name: No Python left behind
        run: |
          stray=$(find plugins -name '*.py' -not -path '*/testdata/*')
          [ -z "$stray" ] || { printf 'the tools are Go now; port or delete:\n%s\n' "$stray"; exit 1; }

      - name: gofmt
        run: |
          unformatted=$(gofmt -l \
            plugins/rook-maintainer/hooks/webfetch-guard \
            plugins/rook-maintainer/tools)
          [ -z "$unformatted" ] || { printf 'gofmt needed:\n%s\n' "$unformatted"; exit 1; }

      - name: go vet
        run: |
          for mod in plugins/rook-maintainer/hooks/webfetch-guard plugins/rook-maintainer/tools; do
            (cd "$mod" && go vet ./...)
          done

      - name: golangci-lint (webfetch-guard)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: plugins/rook-maintainer/hooks/webfetch-guard

      - name: golangci-lint (tools)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          working-directory: plugins/rook-maintainer/tools

      - name: go test
        run: |
          for mod in plugins/rook-maintainer/hooks/webfetch-guard plugins/rook-maintainer/tools; do
            (cd "$mod" && go test ./...)
          done

      - name: shellcheck
        run: |
          shellcheck \
            .github/scripts/release-notes.sh \
            plugins/rook-maintainer/hooks/*.sh \
            plugins/rook-maintainer/tools/run.sh

      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.18.1

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
