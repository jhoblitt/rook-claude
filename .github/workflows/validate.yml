name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Validate marketplace and plugin
        run: |
          claude plugin validate .
          claude plugin validate plugins/rook-maintainer

      - name: Compile Python scripts
        run: python3 -m py_compile plugins/rook-maintainer/skills/*/scripts/*.py

      - name: shellcheck hooks
        run: shellcheck plugins/rook-maintainer/hooks/*.sh

      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.18.1

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" -color
