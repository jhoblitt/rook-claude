branches:
  - main

plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      # The plugin's behavior lives in markdown, so docs/refactor/perf
      # changes ship real content and must cut a release; only
      # chore/ci/test/build/style merges release nothing.
      releaseRules:
        - type: docs
          release: patch
        - type: refactor
          release: patch
        - type: perf
          release: patch
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
      # presetConfig.types replaces the preset's default list, which hides
      # docs/refactor/perf. Every type releaseRules above can cut a release
      # from has to be visible here, or a release built only from those types
      # ships notes with nothing under the header.
      presetConfig:
        types:
          - type: feat
            section: Features
          - type: fix
            section: Bug Fixes
          - type: perf
            section: Performance Improvements
          - type: refactor
            section: Refactoring
          - type: docs
            section: Documentation
          - type: revert
            section: Reverts
          - type: chore
            hidden: true
          - type: ci
            hidden: true
          - type: build
            hidden: true
          - type: test
            hidden: true
          - type: style
            hidden: true
  - - "@semantic-release/changelog"
    - changelogFile: CHANGELOG.md
  # semantic-release joins every plugin's generateNotes output in plugin
  # order, so exec's stdout lands after the commit-derived notes above.
  - - "@semantic-release/exec"
    - generateNotesCmd: >-
        .github/scripts/release-notes.sh
        "${nextRelease.gitTag}" "${lastRelease.gitTag || ''}"
      prepareCmd: >-
        jq --arg v "${nextRelease.version}" '.version = $v'
        plugins/rook-maintainer/.claude-plugin/plugin.json > plugin.json.tmp &&
        mv plugin.json.tmp plugins/rook-maintainer/.claude-plugin/plugin.json
  - - "@semantic-release/git"
    - assets:
        - CHANGELOG.md
        - plugins/rook-maintainer/.claude-plugin/plugin.json
      message: "chore(release): ${nextRelease.version} [skip ci]"
  - - "@semantic-release/github"
    - successComment: false
      failComment: false
      failTitle: false
