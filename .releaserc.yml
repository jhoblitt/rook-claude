branches:
  - main

plugins:
  - - "@semantic-release/commit-analyzer"
    - preset: conventionalcommits
      # The plugin's behavior lives in markdown, so docs/refactor/perf
      # changes ship real content and must cut a release; only
      # chore/ci/test/build/style merges release nothing.
      releaseRules:
        - type: docs
          release: patch
        - type: refactor
          release: patch
        - type: perf
          release: patch
  - - "@semantic-release/release-notes-generator"
    - preset: conventionalcommits
  - - "@semantic-release/changelog"
    - changelogFile: CHANGELOG.md
  - - "@semantic-release/exec"
    - prepareCmd: >-
        jq --arg v "${nextRelease.version}" '.version = $v'
        plugins/rook-maintainer/.claude-plugin/plugin.json > plugin.json.tmp &&
        mv plugin.json.tmp plugins/rook-maintainer/.claude-plugin/plugin.json
  - - "@semantic-release/git"
    - assets:
        - CHANGELOG.md
        - plugins/rook-maintainer/.claude-plugin/plugin.json
      message: "chore(release): ${nextRelease.version} [skip ci]"
  - - "@semantic-release/github"
    - successComment: false
      failComment: false
      failTitle: false
